# AKING0v0的「Clash_Config」Mihomo配置
# 现配置作者：https://github.com/AKING0v0
# 原配置作者：https://github.com/Rabbit-Spec
# 适用版本：所有使用 Mihomo (Meta) 内核的程序，OpenClash使用按需修改

# 全局网络与基础设置
port: 7890
socks-port: 7891
mixed-port: 7892
redir-port: 7893
tproxy-port: 7894
allow-lan: true
mode: rule
log-level: info
ipv6: false
tcp-concurrent: true
unified-delay: true
# 进程匹配模式（OpenClash 环境下设为 off）
find-process-mode: strict

# 面板与外部控制
external-controller: 0.0.0.0:9090

# 数据库与配置文件存储
geox-url:
  mmdb: https://testingcf.jsdelivr.net/gh/alecthw/mmdb_china_ip_list@release/lite/Country.mmdb
  geoip: https://testingcf.jsdelivr.net/gh/Loyalsoldier/v2ray-rules-dat@release/geoip.dat
  geosite: https://testingcf.jsdelivr.net/gh/Loyalsoldier/v2ray-rules-dat@release/geosite.dat
  asn: https://testingcf.jsdelivr.net/gh/xishang0128/geoip@release/GeoLite2-ASN.mmdb
geo-auto-update: true
geo-update-interval: 24
geodata-mode: true
# GeoData 加载模式（内存容量有限路由器应设为 memconservative）
geodata-loader: standard

profile:
  store-selected: true
  store-fake-ip: true

# TUN 设置
tun:
  enable: true
  stack: system
  dns-hijack:
  - any:53
  endpoint-independent-nat: true
  # 自动配置路由表（OpenClash 环境下设为 false）
  auto-route: true
  # 自动检测网络接口（OpenClash 环境下设为 false）
  auto-detect-interface: true
  # 自动配置 iptables 重定向（OpenClash 环境下设为 false）
  auto-redirect: true
  # 严格路由模式（OpenClash 环境下应设为 false）
  strict-route: true
  disable-icmp-forwarding: false

# 流量嗅探设置
sniffer:
  enable: true
  override-destination: true
  sniff:
    QUIC:
      ports:
      - 443
    TLS:
      ports:
      - 443
      - 8443
    HTTP:
      ports:
      - 80
      - 8080-8880
      override-destination: true
  force-domain:
  - "+.netflix.com"
  - "+.nflxvideo.net"
  - "+.amazonaws.com"
  - "+.media.dssott.com"
  skip-domain:
  - "+.mi.com"
  - "+.xiaomi.com"
  - "+.xiaomi.net"
  - "+.oray.com"
  - "+.sunlogin.net"
  - "+.push.apple.com"
  parse-pure-ip: true
  force-dns-mapping: true

# DNS 解析设置
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  listen: 0.0.0.0:7874
  nameserver:
  - https://dns.alidns.com/dns-query
  - https://doh.pub/dns-query
  default-nameserver:
  - 223.5.5.5
  - 119.29.29.29
  fake-ip-filter:
  - "*.lan"
  - "*.localdomain"
