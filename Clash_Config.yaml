# AKING0v0的「Clash_Config」Mihomo配置
# 现配置作者：https://github.com/AKING0v0
# 原配置作者：https://github.com/Rabbit-Spec
# 核心设置保留原版 Clash_Max，策略与规则修改自 ACL4SSR
# 适用版本：所有使用 Mihomo (Meta) 内核的程序

# 全局网络与基础设置
port: 7890
socks-port: 7891
mixed-port: 7892
redir-port: 7893
tproxy-port: 7894
allow-lan: true
mode: rule
log-level: info
ipv6: false
udp: true
tcp-concurrent: true
unified-delay: true

# 面板与外部控制
external-controller: 0.0.0.0:9090

# 数据库与配置文件存储
geox-url:
  mmdb: https://testingcf.jsdelivr.net/gh/alecthw/mmdb_china_ip_list@release/lite/Country.mmdb
  geoip: https://testingcf.jsdelivr.net/gh/Loyalsoldier/v2ray-rules-dat@release/geoip.dat
  geosite: https://testingcf.jsdelivr.net/gh/Loyalsoldier/v2ray-rules-dat@release/geosite.dat
  asn: https://testingcf.jsdelivr.net/gh/xishang0128/geoip@release/GeoLite2-ASN.mmdb

profile:
  store-selected: true
  store-fake-ip: true

# 流量嗅探设置
sniffer:
  enable: true
  override-destination: true
  sniff:
    QUIC:
      ports:
      - 443
      - 8443
    TLS:
      ports:
      - 443
      - 8443
    HTTP:
      ports:
      - 80
      - 8080-8880
      override-destination: true
  force-domain:
  - "+.netflix.com"
  - "+.nflxvideo.net"
  - "+.amazonaws.com"
  - "+.media.dssott.com"
  skip-domain:
  - "+.apple.com"
  - "+.push.apple.com"
  - "+.msftconnecttest.com"
  - "+.msftncsi.com"
  parse-pure-ip: true
  force-dns-mapping: true

# TUN 与附加监听设置
tun:
  enable: true
  stack: system
  dns-hijack:
  - any:53
  auto-route: true
  auto-detect-interface: true

listeners:
  name: socks5-in-1
  type: socks
  port: 10808
  listen: 0.0.0.0
  udp: true
  users: []
  proxy: DIRECT

# DNS 解析设置
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  listen: 0.0.0.0:7874
  nameserver:
  - https://223.5.5.5/dns-query
  - https://1.12.12.12/dns-query
  default-nameserver:
  - 223.5.5.5
  - 119.29.29.29
  fake-ip-filter:
  - "*.lan"
  - "*.local"
  - "localhost.ptlogin2.qq.com"
  - "+.msftconnecttest.com"
  - "+.msftncsi.com"
  - "+.stun.*"
  - "+.stun.*.*"
  - "+.stun.*.*.*"

# 锚点 - 节点订阅的参数
NodeParam: &NodeParam {type: http, interval: 21600, health-check: {enable: true, url: 'https://www.gstatic.com/generate_204', interval: 300}}

# 锚点 - 全局机场名单 (在这里管理所有机场的名字)
# 以后有新机场，只需要在这里加上名字，并在下方 proxy-providers 添加对应配置即可
AllProviderList: &AllProviderList [机场订阅1,机场订阅2]

# 代理提供商
proxy-providers: 
  机场订阅1:
    url: '机场订阅链接1'
    <<: *NodeParam
    path: './proxy_provider/Providers_1.yaml'
  机场订阅2:
    url: '机场订阅链接2'
    <<: *NodeParam
    path: './proxy_provider/Providers_2.yaml'

# 锚点 - 地区筛选正则
FilterAI: &FilterAI '(?i)(🇯🇵|🇹🇼|🇰🇷|🇸🇬|🇺🇸|日|东京|大阪|台|韩|韓|首尔|坡|狮城|美|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|\b(JP|Japan|TW|Taiwan|KR|KOR|Korea|SG|Singapore|US|United States)\d*\b)'
FilterTikTok: &FilterTikTok '(?i)(🇯🇵|🇹🇼|🇰🇷|🇸🇬|🇺🇸|日|东京|大阪|台|韩|韓|首尔|坡|狮城|美|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|\b(JP|Japan|TW|Taiwan|KR|KOR|Korea|SG|Singapore|US|United States)\d*\b)'
FilterHK: &FilterHK '^(?=.*(?i)(🇭🇰|港|\b(HK|Hong Kong|HongKong)\d*\b))(?!.*(?i)(0\.\d+|1\.[1-9]\d*|[2-9](\.\d+)?|\d{2,})[xX倍]).*$'
FilterJP: &FilterJP '(?i)(🇯🇵|日|东京|大阪|\b(JP|Japan)\d*\b)'
FilterTW: &FilterTW '(?i)(🇹🇼|台|\b(TW|Taiwan)\d*\b)'
FilterKR: &FilterKR '(?i)(🇰🇷|韩|韓|首尔|\b(KR|KOR|Korea)\d*\b)'
FilterSG: &FilterSG '(?i)(🇸🇬|坡|狮城|\b(SG|Singapore)\d*\b)'
FilterUS: &FilterUS '(?i)(🇺🇸|美|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|\b(US|United States)\d*\b)'
FilterGlobal: &FilterGlobal '^(?!.*(?i)(群|邀请|返利|循环|官网|客服|网站|网址|获取|订阅|流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|提示|特别|访问|支持|教程|关注|更新|作者|加入|超时|收藏|\b(USE|USED|TOTAL|EXPIRE|EMAIL|Panel|Channel|Author|Traffic)\d*\b|\d{4}-\d{2}-\d{2}|\dG)).*$'

# 锚点 - 自动测速组参数
AutoTest: &AutoTest {type: url-test, url: 'https://www.gstatic.com/generate_204', interval: 300, tolerance: 60}

# 策略组
proxy-groups:
- name: ✈️ 起飞选择
    type: select
    proxies: [♻️ 故障转移, ⚡ 最低延迟, 🇭🇰 香港节点, 🇯🇵 日本节点, 🇺🇲 美国节点, 👆🏻 手动切换]

- name: 🐟 漏网之鱼
    type: select
    proxies: [✈️ 起飞选择, DIRECT, 🇭🇰 香港节点, 🇯🇵 日本节点, 🇺🇲 美国节点, 👆🏻 手动切换]

- name: ♻️ 故障转移
    type: fallback
    url: 'https://www.gstatic.com/generate_204'
    interval: 300
    tolerance: 60
    proxies: [🇭🇰 香港节点, 🇯🇵 日本节点, 🇨🇳 台湾节点]

- name: 👆🏻 手动切换
    type: select
    proxies: [🌏 其他国家]
    use: *AllProviderList
    filter: '.*'

- name: ⚡ 最低延迟
    <<: *AutoTest
    use: *AllProviderList
    # 逻辑：匹配任意字符，且不包含排除关键字
    filter: *FilterGlobal

- name: 💬 Ai平台
    type: select
    proxies: [🇯🇵 日本节点, 🇨🇳 台湾节点, 🇺🇲 美国节点]

- name: 📹 油管视频
    type: select
    proxies: [✈️ 起飞选择, 🇭🇰 香港节点, 🇯🇵 日本节点, 🇨🇳 台湾节点, 🇺🇲 美国节点, 👆🏻 手动切换]

- name: 🎵 TikTok
    type: select
    proxies: [✈️ 起飞选择]
    use: *AllProviderList
    filter: *FilterTikTok

- name: 📲 电报消息
    type: select
    proxies: [✈️ 起飞选择, 🇭🇰 香港节点, 🇯🇵 日本节点, 🇨🇳 台湾节点, 🇺🇲 美国节点, 👆🏻 手动切换]

- name: 📺 哔哩哔哩
    type: select
    proxies: [DIRECT, 🇭🇰 香港节点, 🇨🇳 台湾节点]

- name: 🎓 学术平台
    type: select
    proxies: [DIRECT, 👆🏻 手动切换]

- name: 🪟 微软服务
    type: select
    proxies: [DIRECT, 👆🏻 手动切换]

- name: 🍎 苹果服务
    type: select
    proxies: [DIRECT, 👆🏻 手动切换]

- name: 🎯 全球直连
    type: select
    proxies: [DIRECT, 👆🏻 手动切换]

- name: 🌏 其他国家
    type: select
    use: *AllProviderList
    # 逻辑：排除CN,HK,TW,SG,JP,US,KR
    filter: '^(?!.*(?i)(🇨🇳|🇭🇰|🇹🇼|🇸🇬|🇯🇵|🇺🇸|🇰🇷|中国|香港|台湾|新加坡|狮|日本|东京|大阪|美国|洛杉矶|圣何塞|西雅图|波特兰|韩国|韓|首尔|\b(CN|China|HK|HKG|Hong|TW|TWN|Tai|Taiwan|SG|SGP|Singapore|JP|JPN|Japan|US|USA|United States|KR|KOR|Korea)\d*\b)).*$'

- name: 🇭🇰 香港节点
    <<: *AutoTest
    use: *AllProviderList
    filter: *FilterHK
  
- name: 🇯🇵 日本节点
    <<: *AutoTest
    use: *AllProviderList
    filter: *FilterJP

- name: 🇨🇳 台湾节点
    <<: *AutoTest
    use: *AllProviderList
    filter: *FilterTW

- name: 🇰🇷 韩国节点
    <<: *AutoTest
    use: *AllProviderList
    filter: *FilterKR
  
- name: 🇸🇬 狮城节点
    <<: *AutoTest
    use: *AllProviderList
    filter: *FilterSG
  
- name: 🇺🇲 美国节点
    <<: *AutoTest
    use: *AllProviderList
    filter: *FilterUS
 
