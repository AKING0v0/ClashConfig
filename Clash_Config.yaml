# 锚点 - 节点订阅参数
NodeParam: &NodeParam {type: http, interval: 21600, health-check: {enable: true, url: 'https://www.gstatic.com/generate_204', interval: 300}}

# 锚点 - 全局机场名单 (在这里管理所有机场的名字)
# 以后有新机场，只需要在这里加上名字，并在下方 proxy-providers 添加对应配置即可
AllProviderList: &AllProviderList [机场订阅1,机场订阅2]

# 代理提供商
proxy-providers: 
  机场订阅1:
    url: '机场订阅链接1'
    <<: *NodeParam
    path: './proxy_provider/Providers_1.yaml'
  机场订阅2:
    url: '机场订阅链接2'
    <<: *NodeParam
    path: './proxy_provider/Providers_2.yaml'

# 锚点 - 地区筛选正则
FilterAi: &FilterAi '(?i)(🇯🇵|🇹🇼|🇰🇷|🇸🇬|🇺🇸|日|东京|大阪|台|韩|韓|首尔|坡|狮城|美|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|\b(JP|Japan|TW|Taiwan|KR|KOR|Korea|SG|Singapore|US|United States)\d*\b)'
FilterTikTok: &FilterTikTok '(?i)(🇯🇵|🇹🇼|🇰🇷|🇸🇬|🇺🇸|日|东京|大阪|台|韩|韓|首尔|坡|狮城|美|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|\b(JP|Japan|TW|Taiwan|KR|KOR|Korea|SG|Singapore|US|United States)\d*\b)'
FilterHK: &FilterHK '^(?=.*(?i)(🇭🇰|港|\b(HK|Hong Kong|HongKong)\d*\b))(?!.*(?i)(0\.\d+|1\.[1-9]\d*|[2-9](\.\d+)?|\d{2,})[xX倍]).*$'
FilterJP: &FilterJP '(?i)(🇯🇵|日|东京|大阪|\b(JP|Japan)\d*\b)'
FilterTW: &FilterTW '(?i)(🇹🇼|台|\b(TW|Taiwan)\d*\b)'
FilterKR: &FilterKR '(?i)(🇰🇷|韩|韓|首尔|\b(KR|KOR|Korea)\d*\b)'
FilterSG: &FilterSG '(?i)(🇸🇬|坡|狮城|\b(SG|Singapore)\d*\b)'
FilterUS: &FilterUS '(?i)(🇺🇸|美|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|\b(US|United States)\d*\b)'
FilterGlobal: &FilterGlobal '^(?!.*(?i)(群|邀请|返利|循环|官网|客服|网站|网址|获取|订阅|流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|提示|特别|访问|支持|教程|关注|更新|作者|加入|超时|收藏|\b(USE|USED|TOTAL|EXPIRE|EMAIL|Panel|Channel|Author|Traffic)\d*\b|\d{4}-\d{2}-\d{2}|\dG)).*$'

# 锚点 - 自动测速组参数
AutoTest: &AutoTest {type: url-test, url: 'https://www.gstatic.com/generate_204', interval: 120, tolerance: 60}

# 策略组
proxy-groups:
- name: ✈️ 起飞选择
  type: select
  proxies: [♻️ 故障转移, ⚡ 最低延迟, 🇭🇰 香港节点, 🇯🇵 日本节点, 🇺🇲 美国节点, 👆🏻 手动切换]

- name: 🐟 漏网之鱼
  type: select
  proxies: [✈️ 起飞选择, DIRECT, 🇭🇰 香港节点, 🇯🇵 日本节点, 🇺🇲 美国节点, 👆🏻 手动切换]

- name: ♻️ 故障转移
  type: fallback
  url: 'https://www.gstatic.com/generate_204'
  proxies: [ 🇭🇰 香港节点, 🇯🇵 日本节点, 🇺🇲 美国节点]

- name: 👆🏻 手动切换
  type: select
  proxies: [🧊 冷门国家]
  use: *AllProviderList
  filter: '.*'

- name: ⚡ 最低延迟
  <<: *AutoTest
  use: *AllProviderList
  # 逻辑：匹配任意字符，且不包含排除关键字
  filter: *FilterGlobal

- name: 💬 Ai平台
  type: select

  proxies: [🇯🇵 日本节点, 🇨🇳 台湾节点, 🇺🇲 美国节点]
  use: *AllProviderList
  filter: *FilterAi

- name: 📲 电报消息
  type: select
  proxies: [✈️ 起飞选择, 🇭🇰 香港节点, 🇯🇵 日本节点, 🇺🇲 美国节点]

- name: 📹 油管视频
  type: select
  proxies: [✈️ 起飞选择, 🇭🇰 香港节点, 🇯🇵 日本节点, 🇺🇲 美国节点]

- name: 🎵 TikTok
  type: select
  proxies: [✈️ 起飞选择, 🇨🇳 台湾节点, 🇺🇲 美国节点]
  use: *AllProviderList
  filter: *FilterTikTok

- name: 📺 哔哩哔哩
  type: select
  proxies: [DIRECT, 🇭🇰 香港节点, 🇨🇳 台湾节点]

- name: 🍎 苹果服务
  type: select
  proxies: [DIRECT, ✈️ 起飞选择]

- name: 🪟 微软服务
  type: select
  proxies: [DIRECT, ✈️ 起飞选择]

- name: 🎮 游戏平台
  type: select
  proxies: [DIRECT, ✈️ 起飞选择]

- name: 🎓 学术平台
  type: select
  proxies: [DIRECT, ✈️ 起飞选择]

- name: 🔀 非标端口
  type: select
  proxies: [DIRECT,🐟 漏网之鱼]

- name: 🎯 全球直连
  type: select
  proxies: [DIRECT]

- name: 🧊 冷门国家
  type: select
  use: *AllProviderList
  # 逻辑：排除CN,HK,TW,SG,JP,US,KR
  filter: '^(?!.*(?i)(🇨🇳|🇭🇰|🇹🇼|🇸🇬|🇯🇵|🇺🇸|🇰🇷|中国|香港|台湾|新加坡|狮|日本|东京|大阪|美国|洛杉矶|圣何塞|西雅图|波特兰|韩国|韓|首尔|\b(CN|China|HK|HKG|Hong|TW|TWN|Tai|Taiwan|SG|SGP|Singapore|JP|JPN|Japan|US|USA|United States|KR|KOR|Korea)\d*\b)).*$'

- name: 🇭🇰 香港节点
  <<: *AutoTest
  use: *AllProviderList
  filter: *FilterHK

- name: 🇯🇵 日本节点
  <<: *AutoTest
  use: *AllProviderList
  filter: *FilterJP

- name: 🇨🇳 台湾节点
  <<: *AutoTest
  use: *AllProviderList
  filter: *FilterTW

- name: 🇰🇷 韩国节点
  <<: *AutoTest
  use: *AllProviderList
  filter: *FilterKR

- name: 🇸🇬 狮城节点
  <<: *AutoTest
  use: *AllProviderList
  filter: *FilterSG

- name: 🇺🇲 美国节点
  <<: *AutoTest
  use: *AllProviderList
  filter: *FilterUS

# 规则集定义
RuleSetClassical: &RuleSetClassical {type: http, behavior: classical, interval: 86400}

# 规则提供商
rule-providers:
  Custom_Direct_Domain:
    type: http
    behavior: domain
    interval: 86400
    format: mrs
    url: https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Direct_Domain.mrs
    path: ./ruleset/Custom_Direct_Domain.mrs

  Custom_Direct_IP:
    type: http
    behavior: ipcidr
    interval: 86400
    format: mrs
    url: https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Direct_IP.mrs
    path: ./ruleset/Custom_Direct_IP.mrs

  Custom_Proxy_Domain:
    type: http
    behavior: domain
    interval: 86400
    format: mrs
    url: https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Proxy_Domain.mrs
    path: ./ruleset/Custom_Proxy_Domain.mrs

  Custom_Proxy_IP:
    type: http
    behavior: ipcidr
    interval: 86400
    format: mrs
    url: https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Proxy_IP.mrs
    path: ./ruleset/Custom_Proxy_IP.mrs

  PortDirect:
    <<: *RuleSetClassical
    url: https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Port_Direct.yaml
    path: ./ruleset/PortDirect.yaml

# 路由规则
rules:
# 私有域名及IP
- GEOSITE,private,🎯 全球直连
- GEOIP,private,🎯 全球直连,no-resolve

# 自定义规则
- RULE-SET,Custom_Direct_Domain,🎯 全球直连
- RULE-SET,Custom_Direct_IP,🎯 全球直连,no-resolve
- RULE-SET,Custom_Proxy_Domain,✈️ 起飞选择
- RULE-SET,Custom_Proxy_IP,✈️ 起飞选择,no-resolve

# 精准应用分流
- GEOSITE,category-ai-!cn,💬 Ai平台
- GEOSITE,category-games@cn,🎯 全球直连
- GEOSITE,category-games,🎮 游戏平台
- GEOSITE,github,✈️ 起飞选择
- GEOSITE,youtube,📹 油管视频
- GEOSITE,apple,🍎 苹果服务
- GEOSITE,microsoft,🪟 微软服务
- GEOSITE,tiktok,🎵 TikTok
- GEOSITE,bilibili,📺 哔哩哔哩
- GEOSITE,google,✈️ 起飞选择
- GEOSITE,telegram,📲 电报消息
- GEOSITE,category-scholar-!cn,🎓 学术平台
- GEOIP,google,✈️ 起飞选择,no-resolve
- GEOIP,telegram,📲 电报消息,no-resolve

# GFW 列表的域名走代理
- GEOSITE,gfw,✈️ 起飞选择
# 非中国大陆域名走代理
- GEOSITE,geolocation-!cn,✈️ 起飞选择

# GEO中国大陆直连兜底
- GEOSITE,cn,🎯 全球直连
- GEOIP,cn,🎯 全球直连,no-resolve

# 端口拦截
# 非标端口分流拦截放这里，确保只有常规网页端口漏网后才触发
- RULE-SET,PortDirect,🔀 非标端口

# 最终兜底
- MATCH,🐟 漏网之鱼
