# AKING0v0的「Clash_Config」Mihomo覆写配置
# 现配置作者：https://github.com/AKING0v0
# 原配置作者：https://github.com/Rabbit-Spec
# 核心设置保留原版 Clash_Max，策略与规则修改自 ACL4SSR
# 适用版本：所有使用 Mihomo (Meta) 内核的程序

port: 7890
socks-port: 7891
mixed-port: 7892
redir-port: 7893
tproxy-port: 7894

unified-delay: true
geodata-mode: true
geodata-loader: standard
geo-auto-update: true
geo-update-interval: 24
tcp-concurrent: true
find-process-mode: strict

allow-lan: true
mode: rule
log-level: info
ipv6: false
udp: true

external-controller: 0.0.0.0:9090

geox-url:
  mmdb: 'https://geodata.kelee.one/Country-Masaiki.mmdb'
  asn: 'https://geodata.kelee.one/GeoLite2-ASN-P3TERX.mmdb'
  geosite: 'https://cdn.jsdelivr.net/gh/Loyalsoldier/v2ray-rules-dat@release/geosite.dat' 
  geoip: 'https://cdn.jsdelivr.net/gh/Loyalsoldier/v2ray-rules-dat@release/geoip.dat'

profile:
  store-selected: true
  store-fake-ip: true

sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  force-domain:
    - +.v2ex.com
  skip-domain:
    - '+.mi.com'                  
    - '+.apple.com'               # 如果 Windows 上装了 iCloud 或 Apple Music 必加
    - '+.push.apple.com'
    # --- 针对 Windows 及游戏优化 ---
    - '+.msftconnecttest.com'     # 微软网络探测
    - '+.msftncsi.com'
    - '+.stun.*'                  # 放行所有 STUN 流量，大幅改善游戏语音和 UDP 联机
    - '+.stun.*.*'
    - '+.stun.*.*.*'

tun:
  enable: true
  stack: system
  dns-hijack:
    - any:53
  auto-route: true
  auto-detect-interface: true

listeners:
  name: socks5-in-1
  type: socks
  port: 10808
  listen: 0.0.0.0
  udp: true
  users: []
  proxy: DIRECT

dns:
  enable: true
  prefer-h3: false
  listen: 0.0.0.0:1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '+.lan'
    - '+.local'
    - 'localhost.ptlogin2.qq.com'
    - '+.msftconnecttest.com'
    - '+.msftncsi.com'
    - '+.stun.*'
    - '+.stun.*.*'
    - '+.stun.*.*.*'
default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
nameserver-policy:
    'geosite:cn,private':
      - https://223.5.5.5/dns-query
      - https://1.12.12.12/dns-query
nameserver:
    - https://8.8.8.8/dns-query
    - https://1.1.1.1/dns-query

FilterHK: &FilterHK "^(?=.*(?i)(🇭🇰|香港|\\b(HK|HKG|Hong)\\d*\\b))(?!.*(?i)(0\\.\\d+|1\\.[1-9]\\d*|[2-9](\\.\\d+)?|\\d{2,})[xX倍]).*$"
FilterJP: &FilterJP "(?i)(🇯🇵|日本|东京|大阪|\\b(JP|JPN|Japan)\\d*\\b)"
FilterTW: &FilterTW "(?i)(🇹🇼|台湾|\\b(TW|TWN|Tai|Taiwan)\\d*\\b)"
FilterKR: &FilterKR "(?i)(🇰🇷|韩国|韓|首尔|\\b(KR|KOR|Korea)\\d*\\b)"
FilterSG: &FilterSG "(?i)(🇸🇬|新加坡|狮|\\b(SG|SGP|Singapore)\\d*\\b)"
FilterUS: &FilterUS "(?i)(🇺🇸|美国|洛杉矶|旧金山|圣何塞|西雅图|波特兰|\\b(US|USA|United States)\\d*\\b)"

AutoTest: &AutoTest {type: url-test, url: 'https://www.gstatic.com/generate_204', interval: 120, tolerance: 60}

proxy-groups:
  - name: ✈️ 起飞选择
    type: select
    proxies: [⚡ 最低延迟, 🇭🇰 香港节点, 🇯🇵 日本节点, 🇨🇳 台湾节点, 🇺🇲 美国节点, 👆🏻 手动切换]

  - name: 🐟 漏网之鱼
    type: select
    proxies: [✈️ 起飞选择, DIRECT, 🇭🇰 香港节点, 🇯🇵 日本节点, 🇺🇲 美国节点, 👆🏻 手动切换]

  - name: 👆🏻 手动切换
    type: select
    proxies: [🌏 全球节点]
    include-all: true
    filter: '.*'

  - name: ⚡ 最低延迟
    <<: *AutoTest
    include-all: true
    filter: '^(?=.*(.))(?!.*((?i)群|邀请|返利|循环|官网|客服|网站|网址|获取|订阅|流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|提示|特别|访问|支持|教程|关注|更新|作者|加入|超时|收藏|(\b(USE|USED|TOTAL|EXPIRE|EMAIL|Panel|Channel|Author|Traffic)(\d+)?\b|(\d{4}-\d{2}-\d{2}|\dG)))).*$'

  - name: 💬 Ai平台
    type: select
    proxies: [🇯🇵 日本节点, 🇨🇳 台湾节点, 🇸🇬 狮城节点, 🇺🇲 美国节点]

  - name: 📺 哔哩哔哩
    type: select
    proxies: [DIRECT, 🇭🇰 香港节点, 🇨🇳 台湾节点]

  - name: 📹 油管视频
    type: select
    proxies: [✈️ 起飞选择, 🇭🇰 香港节点, 🇯🇵 日本节点, 🇺🇲 美国节点]

  - name: 🎓 学术平台
    type: select
    proxies: [DIRECT, ✈️ 起飞选择]

  - name: 🪟 微软服务
    type: select
    proxies: [DIRECT, ✈️ 起飞选择]

  - name: 🎯 全球直连
    type: select
    proxies: [DIRECT, ✈️ 起飞选择]

  - name: 🌏 全球节点
    type: select
    include-all: true
    filter: '^(?!.*(?i)(🇨🇳|🇭🇰|🇹🇼|🇸🇬|🇯🇵|🇺🇸|🇰🇷|中国|香港|台湾|新加坡|狮|日本|东京|大阪|美国|洛杉矶|圣何塞|西雅图|波特兰|韩国|韓|首尔|\b(CN|China|HK|HKG|Hong|TW|TWN|Tai|Taiwan|SG|SGP|Singapore|JP|JPN|Japan|US|USA|United States|KR|KOR|Korea)\d*\b)).*$'

  - name: 🇭🇰 香港节点
    <<: *AutoTest
    include-all: true
    filter: *FilterHK
  
  - name: 🇯🇵 日本节点
    <<: *AutoTest
    include-all: true
    filter: *FilterJP

  - name: 🇨🇳 台湾节点
    <<: *AutoTest
    include-all: true
    filter: *FilterTW

  - name: 🇰🇷 韩国节点
    <<: *AutoTest
    include-all: true
    filter: *FilterKR
  
  - name: 🇸🇬 狮城节点
    <<: *AutoTest
    include-all: true
    filter: *FilterSG
  
  - name: 🇺🇲 美国节点
    <<: *AutoTest
    include-all: true
    filter: *FilterUS

RuleSetClassical: &RuleSetClassical {type: http, behavior: classical, interval: 86400, format: text}

rule-providers:
  Lan:
    <<: *RuleSetClassical
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Lan/Lan.list
    path: ./ruleset/Lan.list

  Download:
